<!DOCTYPE html>
<html>
<head>
    <title>DM Dance School - Pais</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #FFE4E1; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #8B0000; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        button { background-color: #D4AF37; color: white; font-weight: bold; cursor: pointer; border: none; }
        .aluno { background: #f9f9f9; margin: 15px 0; padding: 15px; border-radius: 10px; border-left: 4px solid #D4AF37; }
        .pago { color: green; }
        .pendente { color: red; }
        .sucesso { color: green; text-align: center; }
        .erro { color: red; text-align: center; }
        .carregando { text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💃 DM Dance School</h1>
        <h3>Área dos Pais</h3>
        <input type="tel" id="telefone" placeholder="Digite o seu telefone (ex: 912345678)">
        <button onclick="login()">Entrar</button>
        <div id="resultado"></div>
    </div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = "https://saprsfpiacbcmmlzogct.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhcHJzZnBpYWNiY21tbHpvZ2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTA1MTksImV4cCI6MjA5MTU4NjUxOX0.iW3b8211QXm4gAF_HEi1Prt4LcIm0GenVS_LXA5gLqs";

        async function login() {
            const telefone = document.getElementById('telefone').value.trim();
            const resultado = document.getElementById('resultado');
            
            if (!telefone) {
                resultado.innerHTML = '<p class="erro">⚠️ Digite o telefone!</p>';
                return;
            }
            
            resultado.innerHTML = '<p class="carregando">🔄 A carregar dados...</p>';
            
            try {
                // 1. Buscar responsável pelo telefone
                const urlResp = `${SUPABASE_URL}/rest/v1/responsaveis?telefone=eq.${telefone}&select=*`;
                const responseResp = await fetch(urlResp, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!responseResp.ok) {
                    throw new Error(`Erro HTTP: ${responseResp.status}`);
                }
                
                const responsavel = await responseResp.json();
                
                if (!responsavel || responsavel.length === 0) {
                    resultado.innerHTML = '<p class="erro">❌ Telefone não encontrado! Contacte a escola.</p>';
                    return;
                }
                
                const responsavelId = responsavel[0].id;
                
                // 2. Buscar alunos deste responsável
                const urlAlunos = `${SUPABASE_URL}/rest/v1/alunos?responsavel_id=eq.${responsavelId}&select=*`;
                const responseAlunos = await fetch(urlAlunos, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const alunos = await responseAlunos.json();
                
                if (!alunos || alunos.length === 0) {
                    resultado.innerHTML = '<p class="erro">❌ Nenhum aluno encontrado para este responsável.</p>';
                    return;
                }
                
                resultado.innerHTML = `<p class="sucesso">✅ Bem-vindo! Encontramos ${alunos.length} aluno(s).</p>`;
                
                // 3. Para cada aluno, buscar pagamentos
                for (const aluno of alunos) {
                    const urlPag = `${SUPABASE_URL}/rest/v1/pagamentos?aluno_id=eq.${aluno.id}&select=*`;
                    const responsePag = await fetch(urlPag, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    
                    const pagamentos = await responsePag.json();
                    
                    let pagamentosHtml = '';
                    if (pagamentos && pagamentos.length > 0) {
                        for (const p of pagamentos) {
                            const status = p.pago ? '✅ Pago' : '❌ Pendente';
                            const classe = p.pago ? 'pago' : 'pendente';
                            pagamentosHtml += `<li class="${classe}">${p.mes.charAt(0).toUpperCase() + p.mes.slice(1)}/${p.ano}: ${status} - ${p.valor}€</li>`;
                        }
                    } else {
                        pagamentosHtml = '<li>Sem registo de pagamentos</li>';
                    }
                    
                    resultado.innerHTML += `
                        <div class="aluno">
                            <h3>📚 ${aluno.nome}</h3>
                            <p>💃 Modalidades: ${aluno.modalidades ? aluno.modalidades.join(', ') : 'Nenhuma'}</p>
                            <p><strong>📅 Mensalidades:</strong></p>
                            <ul>${pagamentosHtml}</ul>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Erro:', error);
                resultado.innerHTML = '<p class="erro">❌ Erro ao ligar ao servidor. Tente novamente mais tarde.</p>';
            }
        }
    </script>
</body>
</html>
