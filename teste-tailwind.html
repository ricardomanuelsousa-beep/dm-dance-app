<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Tailwind - DM Dance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dm-nome': '#8B0000',
                        'dm-dourado': '#D4AF37',
                    },
                    animation: {
                        'slide-down': 'slideDown 0.5s ease',
                    },
                    keyframes: {
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-pink-200 via-red-50 to-pink-200 p-4 min-h-screen">
    
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-lg overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-br from-amber-400 via-amber-500 to-yellow-700 px-6 py-5 text-center relative">
            <a href="#" class="absolute right-4 top-4 w-9 h-9 rounded-full bg-green-500 text-white flex items-center justify-center shadow-md text-lg no-underline">💬</a>
            <div class="w-[70px] h-[70px] mx-auto mb-2.5 rounded-full flex items-center justify-center shadow-lg bg-white/20">
                <span class="text-[35px]">🩰</span>
            </div>
            <h1 class="text-xl font-bold text-amber-900">DM Dance School</h1>
        </div>

        <!-- Login -->
        <div class="p-8">
            <div class="text-2xl font-bold text-dm-nome text-center mb-1">Área do Aluno</div>
            <div class="text-sm text-gray-500 text-center mb-6">Faça login com o seu telefone</div>
            
            <input type="tel" placeholder="Digite o seu telefone" 
                   class="w-full px-4 py-4 my-2.5 text-lg bg-gray-50 border-2 border-gray-200 rounded-2xl 
                          transition-all outline-none focus:border-dm-dourado focus:bg-white 
                          focus:shadow-[0_0_0_4px_rgba(212,175,55,0.1)]">
            
            <button class="w-full py-4 my-2.5 text-lg font-bold text-white rounded-2xl 
                           bg-gradient-to-br from-amber-400 to-amber-500 
                           shadow-[0_4px_15px_rgba(212,175,55,0.3)] cursor-pointer">
                Entrar
            </button>
            
            <button class="w-full py-4 my-2.5 text-lg font-bold text-white rounded-2xl 
                           bg-gradient-to-br from-green-500 to-green-700 cursor-pointer">
                📲 Instalar App
            </button>
        </div>
    </div>

</body>
</html>
